<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">AI feature deployment and request flow</title>
  <desc id="desc">Illustration of configuring AI environment variables in Render, the FastAPI request checks, and a security note about trusting organization and role headers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#486581"/>
    </marker>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #486581; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .mono { font-family: Consolas, monospace; font-size: 14px; }
      .box { fill: #ffffff; stroke: #9fb3c8; stroke-width: 2; rx: 14; }
      .blue { fill: #eaf2ff; stroke: #4c7bd9; }
      .green { fill: #e6f6ee; stroke: #2f855a; }
      .amber { fill: #fff7e6; stroke: #d69e2e; }
      .red { fill: #fff0f0; stroke: #c53030; }
      .arrow { stroke: #486581; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="850" fill="#f5f8fc"/>
  <text x="50" y="55" class="title">Deploying the AI feature gate</text>
  <text x="50" y="82" class="subtitle">Illustration of the current FastAPI implementation — not a screenshot of Render.</text>

  <rect x="50" y="115" width="310" height="205" class="box blue"/>
  <text x="75" y="150" class="heading">1. Set variables in Render</text>
  <text x="75" y="183" class="mono">OPENAI_API_KEY=••••••</text>
  <text x="75" y="210" class="mono">AI_ENABLED=true</text>
  <text x="75" y="237" class="mono">AI_ORG_ALLOWLIST=org-123</text>
  <text x="75" y="264" class="mono">AI_ORG_BLOCKLIST=org-999</text>
  <text x="75" y="291" class="mono">AI_ALLOWED_ROLES=admin</text>
  <text x="75" y="311" class="small">Render service → Environment → Save / deploy</text>

  <rect x="445" y="145" width="300" height="145" class="box green"/>
  <text x="470" y="180" class="heading">2. FastAPI starts</text>
  <text x="470" y="211" class="body">Reads environment variables</text>
  <text x="470" y="237" class="body">at startup and applies the</text>
  <text x="470" y="263" class="body">same checks to both AI routes.</text>
  <path d="M360 215 L435 215" class="arrow"/>

  <rect x="835" y="115" width="315" height="205" class="box blue"/>
  <text x="860" y="150" class="heading">3. Caller sends a request</text>
  <text x="860" y="185" class="mono">POST /v1/ai/sales-message</text>
  <text x="860" y="215" class="mono">Authorization: Bearer …</text>
  <text x="860" y="245" class="mono">X-Org-Id: org-123</text>
  <text x="860" y="275" class="mono">X-User-Role: admin</text>
  <path d="M835 230 L755 230" class="arrow"/>

  <rect x="250" y="365" width="700" height="230" class="box"/>
  <text x="285" y="403" class="heading">4. Server checks access before calling OpenAI</text>
  <rect x="285" y="425" width="185" height="115" class="box amber"/>
  <text x="305" y="458" class="body">AI_ENABLED?</text>
  <text x="305" y="486" class="small">false → deny (403)</text>
  <text x="305" y="514" class="small">true → continue</text>
  <rect x="508" y="425" width="190" height="115" class="box amber"/>
  <text x="528" y="458" class="body">Org permitted?</text>
  <text x="528" y="486" class="small">allowlist / blocklist</text>
  <text x="528" y="514" class="small">not permitted → 403</text>
  <rect x="735" y="425" width="185" height="115" class="box amber"/>
  <text x="755" y="458" class="body">Role permitted?</text>
  <text x="755" y="486" class="small">if configured</text>
  <text x="755" y="514" class="small">not permitted → 403</text>
  <path d="M470 483 L498 483" class="arrow"/>
  <path d="M698 483 L725 483" class="arrow"/>
  <path d="M600 290 L600 355" class="arrow"/>
  <text x="430" y="570" class="small">All checks pass → verify OpenAI key → generate response</text>

  <rect x="50" y="635" width="1100" height="165" class="box red"/>
  <text x="80" y="674" class="heading">Important before production</text>
  <text x="80" y="706" class="body">The current code reads org allow/block lists from environment variables; changing them generally requires a redeploy.</text>
  <text x="80" y="734" class="body">It reads X-Org-Id and X-User-Role from request headers. A browser/user can forge these headers, so they are not proof of identity.</text>
  <text x="80" y="762" class="body">Only trust org/role values set by authenticated server-side middleware. A real admin toggle needs authenticated identity + persisted org settings.</text>
  <path d="M600 595 L600 625" class="arrow"/>
</svg>
