services:
  - type: web
    name: ai-sales-message
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_TEMPERATURE
        value: "0.6"
      - key: AI_API_TOKEN
        sync: false
